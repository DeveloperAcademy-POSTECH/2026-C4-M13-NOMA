# 기본 룰 중 끄고 싶은 것
disabled_rules:
  - trailing_whitespace #후행 공백

# 선택 룰 중 켜고 싶은 것
opt_in_rules:
  - indentation_width #들여쓰기 폭 일관성 검사
  - shorthand_optional_binding #Shorthand syntax 사용
  - multiline_parameters #함수 선언 파라미터를 모두 같은 줄에 두거나 줄당 하나씩
  - vertical_whitespace_between_cases #switch case 사이에 빈 줄 하나
  - unneeded_parentheses_in_closure_argument #클로저 인자의 불필요한 괄호 금지
  - sorted_imports #import 구문을 알파벳 순으로 정렬
  - closure_body_length #클로저 본문 길이 제한
  - force_unwrapping #강제 언래핑(!) 금지
  - closure_end_indentation #클로저 닫는 중괄호를 시작 줄과 같은 들여쓰기로
  - direct_return #변수에 담았다가 바로 반환하지 말고 직접 return
  - file_name_no_space #파일 이름에 공백 금지
  - no_empty_block #빈 코드 블록 금지 (주석이라도 있어야 함)
  - operator_usage_whitespace #연산자 사용 시 앞뒤 한 칸 공백

closure_body_length:
    warning: 30

multiline_parameters:
  max_number_of_single_line_parameters: 2 #3개 이상이면 줄바꿈

sorted_imports:
  grouping: attributes #빈 줄 그룹별로 독립 검사
